name: Python quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements_m3.txt
      - run: python member2_ml/src/bms_pipeline.py train
      - run: python -m pytest -q member2_ml/tests member3_agent_app/tests
      - run: python member3_agent_app/tests/smoke_all_sessions.py
